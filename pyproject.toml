[project]
name = "plomada-bridge"
version = "0.5.0"
description = "Stdio MCP bridge that drives the Plomada SketchUp extension: AutoCAD plan in, exact 3D house out."
readme = "README.md"
license = "MIT"
authors = [{ name = "Mats2208" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp==2.3.0",
    "ezdxf==1.4.4",
    "pydantic==2.13.5",
    "pymupdf==1.28.2",
    "pillow==13.0.0",
]

[project.scripts]
plomada-mcp = "plomada_bridge.__main__:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plomada_bridge"]

[tool.uv]
required-version = "==0.11.25"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
